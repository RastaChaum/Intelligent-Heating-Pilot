name: Prepare Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.5.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] pushes the RC tag and deletes the dev tag
        with:
          ref: integration
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version format
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version. Expected format: X.Y.Z"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "rc_tag=v${VERSION}-rc1" >> $GITHUB_OUTPUT

          # integration-pr.yml only lets integration into main when an RC
          # exists for exactly the manifest.json version (#196).
          MANIFEST_VERSION=$(jq -r '.version' custom_components/intelligent_heating_pilot/manifest.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::warning::manifest.json on integration is $MANIFEST_VERSION, not $VERSION. Bump manifest.json and hacs.json to $VERSION before opening the integration → main PR."
          fi

      - name: Check RC tag and release state
        id: rc_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          RC_TAG="v${VERSION}-rc1"

          if git rev-parse "$RC_TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT

            if gh release view "$RC_TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
              echo "release_exists=true" >> $GITHUB_OUTPUT
              echo "⚠️ A complete RC already exists for this version"
              echo "Use the 'Increment RC Version' workflow to create rc2, rc3, etc."
              exit 1
            fi

            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Tag $RC_TAG already exists, but its GitHub pre-release is missing"
            echo "ℹ️ The workflow reuses this tag and creates the missing pre-release"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Clean up dev pre-release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          DEV_TAG="v${VERSION}-dev"
          # Query GitHub Releases API — source of truth
          DEV_RELEASE=$(gh release view "$DEV_TAG" --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ -n "$DEV_RELEASE" ]; then
            echo "🗑️ Deleting dev pre-release $DEV_TAG..."
            gh release delete "$DEV_TAG" --yes 2>/dev/null || true
            git push origin ":refs/tags/$DEV_TAG" 2>/dev/null || true
            echo "✅ Dev pre-release deleted"
          else
            echo "ℹ️ No dev pre-release to delete"
          fi

      - name: Extract unreleased changes from CHANGELOG
        id: changelog
        run: |
          # Extract the Unreleased section (between ## [Unreleased] and the next ## section)
          CHANGELOG_CONTENT=$(awk '/^## \[Unreleased\]$/{flag=1;next}/^## \[/{flag=0}flag' CHANGELOG.md)

          # Trim leading and trailing blank lines
          CHANGELOG_CONTENT=$(echo "$CHANGELOG_CONTENT" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "❌ No change in the Unreleased section of CHANGELOG.md"
            echo "Document your changes in CHANGELOG.md first"
            exit 1
          fi

          # Build complete release notes on-the-fly (no file committed to the repo)
          {
            echo "## 🧪 Release Candidate"
            echo ""
            echo "This version is a **release candidate** for production testing and beta testers."
            echo ""
            echo "$CHANGELOG_CONTENT"
            echo ""
            echo "---"
            echo ""
            echo "> ⚠️ This version is being tested. Please report any problem through GitHub Issues."
          } > /tmp/rc-notes.md
          echo "✅ Release notes ready"

      - name: Create RC tag
        if: steps.rc_state.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
          RC_TAG: ${{ steps.validate.outputs.rc_tag }}
        run: |
          git tag -a "$RC_TAG" -m "Release Candidate v${VERSION}-rc1" -m "Release candidate for production testing." -m "Planned changes:" -m "$(cat /tmp/rc-notes.md)"

          git push origin "$RC_TAG"

      - name: Reuse existing RC tag
        if: steps.rc_state.outputs.tag_exists == 'true'
        env:
          RC_TAG: ${{ steps.validate.outputs.rc_tag }}
        run: |
          echo "✅ Reusing existing tag $RC_TAG"

      - name: Create GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_TAG: ${{ steps.validate.outputs.rc_tag }}
        run: |
          gh release create "$RC_TAG" \
            --title "🧪 v${VERSION}-rc1 - Release Candidate" \
            --notes-file /tmp/rc-notes.md \
            --prerelease \
            --target integration

      - name: Summary
        env:
          RC_TAG: ${{ steps.validate.outputs.rc_tag }}
        run: |
          {
            echo "## ✅ Release candidate created"
            echo ""
            echo "**Tag:** \`$RC_TAG\`"
            echo "**Branch:** \`integration\`"
            echo ""
            echo "### 📋 Next steps"
            echo "1. Test the RC in production"
            echo "2. If fixes are needed:"
            echo "   - Merge the fixes into \`integration\`"
            echo "   - Run the 'Increment RC Version' workflow"
            echo "3. If everything is OK:"
            echo "   - Open a PR \`integration\` → \`main\`"
            echo "   - The merge triggers the final release"
          } >> "$GITHUB_STEP_SUMMARY"
