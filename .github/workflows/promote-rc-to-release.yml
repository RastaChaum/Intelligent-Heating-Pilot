name: Promote RC to Final Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] pushes the CHANGELOG branch and merges it into integration
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/intelligent_heating_pilot/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag-check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v${VERSION} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Same check as "Check release candidate exists" in integration-pr.yml
      # (shared in scripts/release-gates.sh), so a merge the gate accepted can
      # always be promoted (#196).
      - name: Verify RC exists
        id: rc-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RC_TAG=$(gh release list --limit 100 --json tagName,isPrerelease \
            | bash scripts/release-gates.sh latest-rc "$VERSION")
          if [ -z "$RC_TAG" ]; then
            echo "❌ No release candidate found for v${VERSION}."
            echo "A validated RC (vX.Y.Z-rcN) must exist before promoting to a final release."
            echo "Use the 'Prepare Release Candidate' or 'Increment RC Version' workflows first."
            exit 1
          fi
          echo "✅ Found $RC_TAG for v${VERSION} — proceeding with promotion"

      - name: Prepare release notes
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG_CONTENT=$(awk '/^## \[Unreleased\]$/{flag=1;next} flag && /^## \[/{flag=0} flag{print}' CHANGELOG.md)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "❌ No [Unreleased] entry in CHANGELOG.md"
            exit 1
          fi

          # Count RC iterations for traceability (GitHub Releases API = ground truth)
          RC_TAGS=$(gh release list --json tagName,isPrerelease \
            | jq -r --arg v "$VERSION" '
                [
                  .[]
                  | select(
                      .isPrerelease == true
                      and (.tagName | test("^v" + $v + "-rc[0-9]+$"))
                    )
                ]
                | sort_by(.tagName | capture("-rc(?<number>[0-9]+)$").number | tonumber)
                | .[].tagName
              ')
          RC_COUNT=$(echo "$RC_TAGS" | grep -c . || true)
          LATEST_RC=$(echo "$RC_TAGS" | tail -1)

          {
            echo "$CHANGELOG_CONTENT"
            if [ "$RC_COUNT" -gt 0 ]; then
              echo ""
              echo "---"
              echo ""
              echo "> ✅ Validated through ${RC_COUNT} release candidate(s). Last RC: \`${LATEST_RC}\`"
            fi
          } > /tmp/release-notes.md

      # The release is published before the CHANGELOG PR: a failure while
      # opening or auto-merging that PR must not block the release itself.
      - name: Create release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "🚀 Release $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest \
            --target main

      - name: Delete RC and dev pre-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Query GitHub Releases API for all pre-releases matching this version (ground truth)
          RC_TAGS=$(gh release list --json tagName,isPrerelease \
            | jq -r --arg v "$VERSION" '
                .[]
                | select(
                    .isPrerelease == true
                    and (.tagName | test("^v" + $v + "-(rc[0-9]+|dev)$"))
                  )
                | .tagName
              ')
          for tag in $RC_TAGS; do
            echo "🗑️ Deleting GitHub release $tag..."
            gh release delete "$tag" --yes 2>/dev/null || true
            git push origin ":refs/tags/$tag" 2>/dev/null || true
          done

      # A PR opened with GITHUB_TOKEN does not trigger workflows, so its
      # validate-integration-pr check would never run (#195). When the
      # optional RELEASE_PR_TOKEN secret (a fine-grained PAT or GitHub App
      # token with pull-requests: write) is set, the PR is opened with it and
      # the checks run; otherwise a maintainer closes and reopens the PR.
      - name: Update CHANGELOG with version (via PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          BRANCH="chore/changelog-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reuse a dedicated branch from main for the CHANGELOG update
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists on origin, reusing it"
            git fetch origin "$BRANCH":"$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch $BRANCH does not exist yet, creating it from main"
            git checkout -b "$BRANCH"
          fi

          # Guard against duplicate entries: only update CHANGELOG if this version is not already stamped
          if grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "ℹ️ CHANGELOG already contains ## [$VERSION] — skipping sed substitution"
          else
            sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $TODAY/" CHANGELOG.md
          fi

          git add CHANGELOG.md
          # Only commit if there are actual changes to avoid empty-commit errors on re-runs
          if git diff --cached --quiet; then
            echo "ℹ️ No CHANGELOG changes to commit"
          else
            git commit -m "chore: update CHANGELOG for v$VERSION"
          fi

          # Short-circuit if there are no CHANGELOG changes between this branch and origin/main
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if git diff --quiet origin/main...HEAD -- CHANGELOG.md; then
              echo "ℹ️ No CHANGELOG changes between branch $BRANCH and origin/main — skipping push and PR creation"
              exit 0
            fi
          fi

          git push origin "$BRANCH"

          # Open a PR targeting main, or retrieve the existing one on re-runs
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
            echo "ℹ️ Reusing existing PR: $PR_URL"
          else
            PR_BODY=$(printf '%s\n\n%s' \
              "🤖 Automatic CHANGELOG update triggered by the release of v${VERSION}." \
              "This PR was created automatically by the **Promote RC to Release** workflow after the \`integration\` → \`main\` merge. It replaces the \`[Unreleased]\` section header with the actual version number and today's date.")
            PR_URL=$(GH_TOKEN="${PR_TOKEN:-$GITHUB_TOKEN}" gh pr create \
              --title "chore: update CHANGELOG for v$VERSION" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH")
            echo "✅ PR created: $PR_URL"
            if [ -z "$PR_TOKEN" ]; then
              echo "::notice::$PR_URL was opened with GITHUB_TOKEN, so its checks do not run. Close and reopen it to run them, or set the RELEASE_PR_TOKEN secret."
            fi
          fi

          # Enable auto-merge with a merge commit, the only method the main ruleset
          # allows (squash failed the 0.6.4 promotion). The PR still needs an approval.
          set +e
          MERGE_OUTPUT=$(gh pr merge "$PR_URL" --auto --merge 2>&1)
          MERGE_EXIT_CODE=$?
          set -e
          if [ "$MERGE_EXIT_CODE" -ne 0 ]; then
            # The release is already published at this point; only warn so the
            # remaining steps still run, and leave the PR for a manual merge.
            echo "$MERGE_OUTPUT"
            echo "::warning::Auto-merge could not be enabled for $PR_URL. Please merge it manually."
          fi

      # main only gets the stamp through the PR above; integration must get it
      # too, otherwise the released entries stay under [Unreleased] there and
      # reappear in the next release notes. The stamp commit itself is merged
      # (not re-applied), so the next integration -> main merge sees a common
      # ancestor instead of two competing edits. integration only forbids
      # deletion, so the merge is pushed directly.
      - name: Merge CHANGELOG stamp into integration
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="chore/changelog-v${VERSION}"

          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "ℹ️ No $BRANCH branch on origin, nothing to merge into integration"
            exit 0
          fi

          git fetch origin integration "$BRANCH"
          git checkout -B changelog-integration origin/integration
          git merge --no-edit "origin/$BRANCH" -m "chore: merge CHANGELOG for v$VERSION into integration"
          git push origin HEAD:integration

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🚀 **Release v${VERSION} published!**

          The release is now available to all users.

          **Next steps:**
          1. Approve and merge the \`chore/changelog-v${VERSION}\` PR that stamps the release date on \`main\`
          2. On \`integration\`, bump the version in \`manifest.json\` and \`hacs.json\` for the next release
          3. Check that HACS detects the new release
          "
