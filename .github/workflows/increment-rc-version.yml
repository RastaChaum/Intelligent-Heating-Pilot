name: Increment RC Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version (e.g., 0.5.0)'
        required: true
        type: string
      fix_description:
        description: 'Description of fixes in this RC increment'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  increment-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: integration
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The next RC tag normally follows the latest tag. If a previous run
      # pushed that tag but failed before publishing its release, the tag is
      # reused instead of skipping a number (#196).
      - name: Find next RC number
        id: rc-number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version. Expected format: X.Y.Z"
            exit 1
          fi

          LAST_TAG=$(git tag -l "v${VERSION}-rc*" | grep -E "^v${VERSION//./\\.}-rc[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$LAST_TAG" ]; then
            echo "❌ No RC found for v${VERSION}"
            echo "Use the 'Prepare Release Candidate' workflow first"
            exit 1
          fi

          # Latest published RC pre-release: its notes are carried over and it
          # is deleted once the new RC is published.
          PREV_RELEASE=$(gh release list --limit 100 --json tagName,isPrerelease \
            | scripts/release-gates.sh latest-rc "$VERSION")

          if gh release view "$LAST_TAG" --json tagName >/dev/null 2>&1; then
            LAST_RC_NUM=${LAST_TAG##*-rc}
            NEXT_RC_NUM=$((LAST_RC_NUM + 1))
            RESUME=false
          else
            NEXT_RC_NUM=${LAST_TAG##*-rc}
            RESUME=true
            echo "⚠️ Tag $LAST_TAG has no GitHub release (interrupted run): publishing it instead of a new number"
          fi

          {
            echo "prev_release=$PREV_RELEASE"
            echo "next_rc_num=$NEXT_RC_NUM"
            echo "next_rc_tag=v${VERSION}-rc${NEXT_RC_NUM}"
            echo "resume=$RESUME"
          } >> "$GITHUB_OUTPUT"

          echo "📊 Current RC release: ${PREV_RELEASE:-none}"
          echo "📊 Next RC: v${VERSION}-rc${NEXT_RC_NUM}"

      - name: Build updated release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          PREV_RELEASE: ${{ steps.rc-number.outputs.prev_release }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          # Carry over the current RC notes (with their "RC N" sections); rebuild
          # them from the CHANGELOG when no RC release is left.
          PREV_NOTES=""
          if [ -n "$PREV_RELEASE" ]; then
            PREV_NOTES=$(gh release view "$PREV_RELEASE" --json body --jq '.body' 2>/dev/null || true)
          fi

          if [ -z "$PREV_NOTES" ]; then
            CHANGELOG_CONTENT=$(awk '/^## \[Unreleased\]$/{flag=1;next} flag && /^## \[/{flag=0} flag{print}' CHANGELOG.md | sed '/./,$!d')

            {
              echo "## 🧪 Release Candidate"
              echo ""
              echo "This version is a **release candidate** for production testing and beta testers."
              echo ""
              if [ -n "$CHANGELOG_CONTENT" ]; then
                echo "$CHANGELOG_CONTENT"
                echo ""
              else
                echo "> ℹ️ Initial notes unavailable: rebuilt from the current state of the integration branch."
                echo ""
              fi
              echo "---"
            } > /tmp/prev-rc-notes.md
            PREV_NOTES=$(cat /tmp/prev-rc-notes.md)
          fi

          {
            echo "$PREV_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "## 🔧 RC ${RC_NUM} - $(date +%Y-%m-%d)"
            echo ""
            echo "$FIX_DESCRIPTION"
          } > /tmp/new-rc-notes.md
          echo "✅ Release notes updated"

      - name: Create new RC tag
        if: steps.rc-number.outputs.resume != 'true'
        env:
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          git tag -a "$NEXT_RC_TAG" -m "Release Candidate v${VERSION}-rc${RC_NUM}" -m "Fixes:" -m "$FIX_DESCRIPTION"

          git push origin "$NEXT_RC_TAG"

      - name: Create new GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
        run: |
          gh release create "$NEXT_RC_TAG" \
            --title "🧪 v${VERSION}-rc${RC_NUM} - Release Candidate" \
            --notes-file /tmp/new-rc-notes.md \
            --prerelease \
            --verify-tag

      # Only once the new RC is published: deleting first left no RC at all
      # when the creation failed (#196). The old tag is kept for history.
      - name: Delete previous RC release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_RELEASE: ${{ steps.rc-number.outputs.prev_release }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
        run: |
          # Non-fatal: re-running the workflow after a failure here would
          # publish yet another RC instead of retrying the deletion.
          if [ -n "$PREV_RELEASE" ] && [ "$PREV_RELEASE" != "$NEXT_RC_TAG" ]; then
            if gh release delete "$PREV_RELEASE" --yes; then
              echo "🗑️ Deleted previous RC release $PREV_RELEASE (tag kept)"
            else
              echo "::warning::Could not delete $PREV_RELEASE. Delete it manually (keep its tag); do not re-run this workflow."
            fi
          fi

      - name: Find and update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RC_NUM: ${{ steps.rc-number.outputs.next_rc_num }}
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
          RELEASE_URL_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --label "release-candidate" \
            --search "RC Testing: v${VERSION}" \
            --json number \
            --jq '.[0].number')

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "## 🔄 New RC available: rc${RC_NUM}

            **Tag:** \`$NEXT_RC_TAG\`

            ### Fixes
            $FIX_DESCRIPTION

            ### 🔗 Link
            [GitHub pre-release]($RELEASE_URL_BASE/$NEXT_RC_TAG)

            Please test this new version and report any problem in this issue."
          fi

      - name: Summary
        env:
          NEXT_RC_TAG: ${{ steps.rc-number.outputs.next_rc_tag }}
          PREV_RELEASE: ${{ steps.rc-number.outputs.prev_release }}
          FIX_DESCRIPTION: ${{ inputs.fix_description }}
        run: |
          {
            echo "## ✅ New release candidate created"
            echo ""
            echo "**Tag:** \`$NEXT_RC_TAG\`"
            echo "**Previous:** \`${PREV_RELEASE:-none}\`"
            echo ""
            echo "### 🔧 Fixes"
            echo "$FIX_DESCRIPTION"
            echo ""
            echo "### 📋 Next steps"
            echo "1. Test the new RC"
            echo "2. If more fixes are needed → run this workflow again"
            echo "3. If everything is OK → open the \`integration\` → \`main\` PR for the final release"
          } >> "$GITHUB_STEP_SUMMARY"
