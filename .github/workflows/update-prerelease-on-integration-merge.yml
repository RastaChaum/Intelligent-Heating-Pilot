name: Update Pre-Release on Integration Merge

# Keeps the vX.Y.Z-dev pre-release in step with the integration branch.
# Release candidates are never touched here (#197): an RC tag is immutable, and
# its notes (with the "RC N" sections written by increment-rc-version.yml) must
# describe what that tag contains, not what was merged afterwards.

on:
  pull_request:
    branches:
      - integration
    types: [closed]

permissions:
  contents: write

jobs:
  update-prerelease:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration
        uses: actions/checkout@v7
        with:
          ref: integration
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve pre-release target
        id: target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' custom_components/intelligent_heating_pilot/manifest.json)
          DEV_TAG="v${VERSION}-dev"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"

          # GitHub Releases are the ground truth, not git tags: old RC tags are
          # kept after their release is deleted.
          LATEST_RC=$(gh release list --limit 100 --json tagName,isPrerelease \
            | scripts/release-gates.sh latest-rc "$VERSION")
          DEV_RELEASE=$(gh release view "$DEV_TAG" --json tagName --jq '.tagName' 2>/dev/null || echo "")

          if [ -n "$LATEST_RC" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "ℹ️ v${VERSION} is in RC phase ($LATEST_RC): RC notes are left untouched"
          elif [ -n "$DEV_RELEASE" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "📋 Found dev release to update: $DEV_TAG"
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
            echo "📋 No pre-release found — will create: $DEV_TAG"
          fi

      - name: Build release notes
        id: notes
        if: steps.target.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          CHANGELOG_CONTENT=$(awk '/^## \[Unreleased\]$/{flag=1;next} flag && /^## \[/{flag=0} flag{print}' CHANGELOG.md | sed '/./,$!d')

          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No [Unreleased] content in CHANGELOG — skipping"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          {
            echo "## 🔧 Work in Progress — v${VERSION}"
            echo ""
            echo "Preview of the changes under development on the \`integration\` branch."
            echo ""
            echo "$CHANGELOG_CONTENT"
            echo ""
            echo "---"
            echo ""
            echo "> ⚠️ Untested version — for developers only. Use the stable releases in production."
          } > /tmp/prerelease-notes.md

      # In both modes the dev tag must point at the integration HEAD the notes
      # describe; it used to be moved only when the release was created (#197).
      - name: Move dev tag to integration HEAD
        if: steps.target.outputs.mode != 'skip' && steps.notes.outputs.skip == 'false'
        env:
          DEV_TAG: ${{ steps.target.outputs.dev_tag }}
        run: |
          git tag -f "$DEV_TAG"
          git push origin "refs/tags/$DEV_TAG" --force
          echo "✅ $DEV_TAG now points at $(git rev-parse --short HEAD)"

      - name: Create dev pre-release
        if: steps.target.outputs.mode == 'create' && steps.notes.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.target.outputs.version }}
          DEV_TAG: ${{ steps.target.outputs.dev_tag }}
        run: |
          gh release create "$DEV_TAG" \
            --title "🔧 v${VERSION}-dev — Work in Progress" \
            --notes-file /tmp/prerelease-notes.md \
            --prerelease \
            --verify-tag

          echo "✅ Dev pre-release created: $DEV_TAG"

      - name: Update dev pre-release notes
        if: steps.target.outputs.mode == 'update' && steps.notes.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_TAG: ${{ steps.target.outputs.dev_tag }}
        run: |
          gh release edit "$DEV_TAG" --notes-file /tmp/prerelease-notes.md
          echo "✅ Dev pre-release $DEV_TAG updated with the latest CHANGELOG"
