name: Feature/Fix PR Checks

on:
  pull_request:
    branches:
      - integration
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Dependabot branches (dependabot/...) cannot follow the naming convention and do
# not touch the CHANGELOG, so those checks are skipped for them; tests still run.
# Maintenance branches (chore/, ci/, docs/, refactor/, test/) carry no user-facing
# change, so the CHANGELOG check is skipped for them too.
# Dependabot runs and PRs from forks get a read-only token, so PR comments are
# skipped for them (the check result itself still reports success or failure).

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate branch naming
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(copilot/)?(feature|fix)/issue-[0-9]+ ]] && \
             [[ ! "$BRANCH" =~ ^[0-9]{3,}-[a-z][a-z0-9-]*$ ]] && \
             [[ ! "$BRANCH" =~ ^(chore|ci|docs|refactor|test)/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "❌ The branch must be named 'feature/issue-NNN', 'fix/issue-NNN', 'NNN-description'"
            echo "   or '<chore|ci|docs|refactor|test>/description'"
            echo "Current name: $BRANCH"
            exit 1
          fi

          echo "✅ Valid branch name: $BRANCH"

      - name: Check CHANGELOG update
        id: changelog-check
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.head_ref, 'chore/') && !startsWith(github.head_ref, 'ci/') &&
          !startsWith(github.head_ref, 'docs/') && !startsWith(github.head_ref, 'refactor/') &&
          !startsWith(github.head_ref, 'test/')
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SECTION="Added"
          if [[ "$BRANCH" =~ ^(copilot/)?fix/ ]]; then
            SECTION="Fixed"
          fi

          HEAD_CHANGELOG_CONTENT=$(cat CHANGELOG.md)
          BASE_CHANGELOG_CONTENT=$(git show origin/integration:CHANGELOG.md)

          if ! printf '%s\n' "$HEAD_CHANGELOG_CONTENT" | grep -q '^## \[Unreleased\]'; then
            echo "❌ CHANGELOG.md is missing the ## [Unreleased] header"
            echo "Please add an entry under ## [Unreleased] describing your change:"
            echo ""
            echo "  ## [Unreleased]"
            echo ""
            echo "  ### $SECTION"
            echo "  - [User-facing description of your change]"
            exit 1
          fi

          if ! printf '%s\n' "$BASE_CHANGELOG_CONTENT" | grep -q '^## \[Unreleased\]'; then
            echo "❌ Base CHANGELOG.md on origin/integration is missing the ## [Unreleased] header"
            exit 1
          fi

          HEAD_UNRELEASED=$(printf '%s\n' "$HEAD_CHANGELOG_CONTENT" \
            | awk '/^## \[Unreleased\]$/{flag=1;next} /^## \[/{flag=0} flag{print}' \
            | grep -v '^[[:space:]]*$' || true)
          BASE_UNRELEASED=$(printf '%s\n' "$BASE_CHANGELOG_CONTENT" \
            | awk '/^## \[Unreleased\]$/{flag=1;next} /^## \[/{flag=0} flag{print}' \
            | grep -v '^[[:space:]]*$' || true)

          NEW_LINES=$(diff <(printf '%s\n' "$BASE_UNRELEASED") <(printf '%s\n' "$HEAD_UNRELEASED") \
            | grep '^>' | wc -l)

          if [ "$NEW_LINES" -eq 0 ]; then
            echo "❌ No new lines added to the [Unreleased] section of CHANGELOG.md"
            echo "Please add an entry under ## [Unreleased] describing your change:"
            echo ""
            echo "  ## [Unreleased]"
            echo ""
            echo "  ### $SECTION"
            echo "  - [User-facing description of your change]"
            exit 1
          fi
          echo "✅ CHANGELOG [Unreleased] section updated ($NEW_LINES new line(s))"

      - name: Suggest CHANGELOG template
        if: steps.changelog-check.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TYPE="Added"

          if [[ "$BRANCH" =~ ^(copilot/)?fix/ ]]; then
            TYPE="Fixed"
          fi

          gh pr comment "$PR_NUMBER" --body "⚠️ **CHANGELOG not updated**

          Please add an entry under the \`[Unreleased]\` section of CHANGELOG.md:

          \`\`\`markdown
          ## [Unreleased]

          ### $TYPE
          - [User-facing description of your change]
          \`\`\`

          **Good practices:**
          - Use plain language an end user understands
          - Avoid technical details unless relevant
          - Describe the benefit, not the implementation

          **Examples:**
          - ✅ \`More accurate preheating time\`
          - ❌ \`Refactor PilotController.calculate_preheat_duration()\`
          "

      # Feature branches are 'feature/issue-NNN' (optionally under 'copilot/'),
      # as enforced by "Validate branch naming" above (#198).
      - name: Check for documentation updates on features
        if: (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'copilot/feature/')) && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DOCS_CHANGED=$(git diff origin/integration --name-only | grep -E '(README.md|docs/)' | wc -l)

          if [ "$DOCS_CHANGED" -eq "0" ]; then
            gh pr comment "$PR_NUMBER" --body "📚 **Reminder: user documentation**

            This PR adds a new feature. Remember to update the documentation if needed:
            - \`README.md\` (and \`README.fr.md\`): main user guide
            - \`docs/\`: detailed documentation

            If the feature is not visible to end users, you can ignore this message.
            "
          fi

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        id: tests
        run: poetry run pytest tests/unit -v

      - name: Comment test results
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$TESTS_OUTCOME" == "success" ]; then
            gh pr comment "$PR_NUMBER" --body "✅ **Unit tests passed**"
          else
            gh pr comment "$PR_NUMBER" --body "❌ **Unit tests failed**

            Please fix the tests before merging."
          fi
