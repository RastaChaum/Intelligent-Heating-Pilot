name: Feature/Fix PR Checks

on:
  pull_request:
    branches:
      - integration
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: |
          BRANCH="${{ github.head_ref }}"

          if [[ ! "$BRANCH" =~ ^(copilot/)?(feature|fix)/issue-[0-9]+ ]]; then
            echo "❌ La branche doit suivre le format 'feature/issue-XXX' ou 'fix/issue-XXX'"
            echo "Nom actuel : $BRANCH"
            exit 1
          fi

          echo "✅ Nom de branche valide : $BRANCH"

      - name: Check CHANGELOG update
        id: changelog-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref }}"
          TYPE="Added"

          if [[ "$BRANCH" =~ ^(copilot/)?fix/ ]]; then
            TYPE="Fixed"
          fi

          if ! bash .specify/scripts/bash/check-changelog.sh --check-diff; then
            echo "updated=false" >> $GITHUB_OUTPUT

            gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **CHANGELOG not updated**

          Please add an entry in the \`[Unreleased]\` section of CHANGELOG.md:

          \`\`\`markdown
          ## [Unreleased]

          ### $TYPE
          - [User-facing description of your change]
          \`\`\`

          **Best practices:**
          - Use language that is simple and understandable by the end user
          - Avoid technical details unless relevant
          - Describe the benefit, not the implementation

          **Examples:**
          - ✅ \`Improved preheat duration calculation\`
          - ❌ \`Refactored PilotController.calculate_preheat_duration()\`
          "

            exit 1
          fi

          echo "updated=true" >> $GITHUB_OUTPUT
          echo "✅ CHANGELOG.md [Unreleased] section is present and contains content"

      - name: Check for documentation updates on features
        if: startsWith(github.head_ref, 'feature-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOCS_CHANGED=$(git diff origin/integration --name-only | grep -E '(README.md|docs/)' | wc -l)

          if [ "$DOCS_CHANGED" -eq "0" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "📚 **Rappel : Documentation utilisateur**

            Cette PR ajoute une nouvelle fonctionnalité. N'oubliez pas de mettre à jour la documentation si nécessaire :
            - \`README.md\` : Guide utilisateur principal
            - \`docs/\` : Documentation technique détaillée

            Si la fonctionnalité n'est pas visible par l'utilisateur final, vous pouvez ignorer ce message.
            "
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.2'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/unit -v

      - name: Comment test results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $? -eq 0 ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "✅ **Tests unitaires réussis**"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "❌ **Tests unitaires échoués**

            Veuillez corriger les tests avant de merger."
          fi
