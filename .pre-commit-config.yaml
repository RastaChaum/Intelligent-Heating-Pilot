# Pre-commit hooks configuration for Intelligent Heating Pilot
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|docs/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|docs/)
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags in HA yaml files
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

  # Python syntax and import checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast  # Verify Python syntax
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements  # Check for debugger imports and breakpoints

  # Ruff and mypy run from the Poetry environment, like CI: the versions pinned in
  # poetry.lock and the configuration in pyproject.toml. A pinned hook repo drifts
  # (ruff 0.6 classified zoneinfo as a third-party import on Python 3.14, and the
  # mypy mirror ran without Home Assistant installed, so its types were Any).
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: poetry run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: poetry run mypy custom_components/intelligent_heating_pilot/
        language: system
        pass_filenames: false
        files: ^custom_components/intelligent_heating_pilot/

  # Security: Check for common security issues
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]', 'pbr']
        exclude: ^tests/

# Configuration for specific hooks
default_language_version:
  python: python3.14

# Prevent committing to main branch directly
fail_fast: false
